<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12:55 — 전광판</title>
<link rel="stylesheet" href="style.css">
<style>
/* ═══════════════════════════════════════════════════════════
   전광판 — 군중이 주인공이다.
   생존자 수는 숫자가 아니라 화면에 남아 있는 사람이고,
   집계는 좌우로 갈라선 무리이고, 탈락은 올라가는 층에 못 탄 것이다.

   가독성이 분위기를 이긴다는 원칙은 그대로다. 기준은 3m 판독.
   ═══════════════════════════════════════════════════════════ */

body { overflow: hidden; }
.guides { display: none; }

.board {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-rows: auto 1fr;
  grid-template-columns: 1fr minmax(250px, 20vw);
  grid-template-areas: "head head" "stage side";
  background: var(--ground);
}

/* ── 헤더 */
.bhead {
  grid-area: head;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 14px clamp(18px, 2vw, 36px);
  border-bottom: 2px solid var(--line-2);
  z-index: 3;
}

.bhead .logo {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: clamp(24px, 2.6vw, 40px);
  font-weight: 700;
  letter-spacing: -0.045em;
}

.bhead .logo .colon { color: var(--amber); }

.bhead .meta { display: flex; gap: clamp(14px, 1.8vw, 32px); align-items: baseline; }
.bhead .meta div { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.bhead .meta .k { font-family: var(--mono); font-size: clamp(9px, 0.75vw, 12px); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
.bhead .meta .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: clamp(18px, 1.8vw, 28px); font-weight: 700; letter-spacing: -0.03em; }

.vip-flag {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 12px; border: 2px solid var(--amber); color: var(--amber);
  font-weight: 700; font-size: clamp(12px, 1.1vw, 17px);
}
.vip-flag[data-alive="false"] { border-color: var(--out); color: var(--out); }

/* ── 무대
   위에서 아래로 문항 → 집계 → 군중. 참여자 화면과 같은 구성이다.
   문항을 군중 위에 겹치면 멋있긴 한데 3m 밖에서 글자가 군중에 묻힌다. */
.stage {
  grid-area: stage;
  position: relative;
  min-width: 0;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr;
}

.stage-info {
  display: flex; flex-direction: column; gap: 12px;
  padding: clamp(14px, 1.8vw, 32px) clamp(16px, 2.2vw, 40px) clamp(10px, 1.2vw, 18px);
  border-bottom: 1px solid var(--line);
  z-index: 2;
}

.stage-canvas-wrap { position: relative; min-height: 0; }
#stage-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* 전광판 문항도 명세서 본문이다 */
.bq {
  font-family: var(--serif);
  font-size: clamp(22px, 2.7vw, 46px);
  font-weight: 700; line-height: 1.3; letter-spacing: -0.025em;
  margin: 0; max-width: 92%; text-wrap: balance;
  min-height: 1.3em;
}

.stage-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }

/* 중계 자막 — 소리가 안 나는 환경에서도 진행이 읽혀야 한다 */
.bcaption {
  margin: 0;
  min-height: 1.5em;
  font-size: clamp(14px, 1.3vw, 22px);
  line-height: 1.45;
  color: var(--ink-2);
}
.bcaption[data-tone="rule"] { color: var(--amber); font-weight: 700; }
.bcaption[data-tone="bad"] { color: var(--out); }
.bcaption[data-tone="good"] { color: var(--live); }
.bcaption[data-tone="cue"] { color: var(--ink); font-weight: 700; }

/* 본부별 잔여 현황 */
.divstand { display: flex; flex-direction: column; border-bottom: 1px solid var(--line); }
.divstand .row {
  display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center;
  padding: 6px 16px; font-size: clamp(11px, 0.95vw, 15px);
}
.divstand .row i { width: 10px; height: 10px; border-radius: 2px; display: block; }
.divstand .row .n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; }
.divstand .row.lead .n { color: var(--amber); }

.bcount { display: flex; align-items: baseline; gap: clamp(10px, 1.2vw, 20px); }
.bcount .n {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: clamp(40px, 5.4vw, 92px); font-weight: 700; line-height: 0.84;
  letter-spacing: -0.055em; color: var(--live);
}
.bcount .k { font-family: var(--mono); font-size: clamp(11px, 1.1vw, 18px); letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-2); }
.bcount .drop { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: clamp(18px, 1.9vw, 32px); font-weight: 700; color: var(--out); }

.split { display: flex; flex-direction: column; gap: 6px; min-width: clamp(160px, 20vw, 320px); }
.split-nums { display: flex; justify-content: space-between; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: clamp(15px, 1.6vw, 26px); font-weight: 700; }
.split-bar { display: flex; height: clamp(10px, 1.2vh, 18px); background: rgba(20,20,20,.12); overflow: hidden; }
.split-bar span { display: block; transition: width 260ms cubic-bezier(.25,.46,.45,.94); }
.split-bar .s-o { background: var(--ink-2); }
.split-bar .s-x { background: var(--surface-3); }
.split.hidden .split-bar { background: repeating-linear-gradient(90deg, rgba(20,20,20,.12) 0 6px, transparent 6px 12px); }
.split.hidden .split-nums { color: var(--ink-3); }

.btimer { height: 8px; background: rgba(20,20,20,.14); overflow: hidden; margin-bottom: 12px; }
.btimer .fill { height: 100%; background: var(--amber); transform-origin: left center; }
.btimer.urgent .fill { background: var(--out); }

/* ── 사이드 */
.bside { grid-area: side; border-left: 2px solid var(--line-2); display: flex; flex-direction: column; min-height: 0; }


.divlegend { display: flex; flex-wrap: wrap; gap: 5px 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.divlegend div { display: flex; align-items: center; gap: 5px; font-size: clamp(10px, 0.85vw, 13px); color: var(--ink-2); }
.divlegend i { width: 9px; height: 9px; border-radius: 2px; display: block; }

.bside h2 {
  margin: 0; padding: 12px 16px;
  font-family: var(--mono); font-size: clamp(10px, 0.85vw, 13px);
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3);
  border-bottom: 1px solid var(--line); font-weight: 600;
}

.feed { flex: 1; overflow: hidden; display: flex; flex-direction: column-reverse; justify-content: flex-end; }
.feed-item {
  display: flex; align-items: baseline; gap: 8px;
  padding: 9px 16px; border-bottom: 1px solid var(--line);
  font-size: clamp(13px, 1vw, 17px);
  animation: slidein 300ms cubic-bezier(.215,.61,.355,1);
}
@keyframes slidein { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
.feed-item .nm { font-weight: 700; }
.feed-item .dp { color: var(--ink-3); font-size: 0.8em; }
.feed-item .q { margin-left: auto; font-family: var(--mono); font-size: 0.78em; color: var(--ink-3); }
.feed-item.revived { color: var(--live); }
.feed-item.vip .nm { color: var(--amber); }

/* ── 중앙 오버레이 (대기 / 결과 / 오디오 잠금) */
.bcenter {
  position: absolute; inset: 0; z-index: 4;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  gap: clamp(10px, 1.8vh, 24px); padding: clamp(20px, 3vw, 56px); text-align: center;
  background: var(--surface);
}

/* 우승 장면에서는 화면을 덮으면 안 된다. 옥상과 챔피언이 그 아래 있기 때문이다.
   글자는 위쪽에 모으고 배경은 위에서 아래로 사라지게 한다. */
.bcenter.on-rooftop {
  justify-content: flex-start;
  gap: clamp(6px, 1vh, 14px);
  padding-top: clamp(18px, 3vh, 44px);
  background: linear-gradient(180deg, rgba(250,247,240,.97) 0%, rgba(250,247,240,.90) 34%, rgba(250,247,240,.40) 56%, rgba(250,247,240,0) 72%);
  pointer-events: none;
}

.bcenter.on-rooftop .champ-name { font-family: var(--serif); text-shadow: 0 1px 0 var(--surface); }
.bcenter.on-rooftop .blist { display: none; }   /* 순위표는 옥상을 가린다 */

.bcenter .huge {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: clamp(76px, 15vw, 260px); font-weight: 700; line-height: 0.86;
  letter-spacing: -0.055em; color: var(--amber);
}
.bcenter .champ-name { font-family: var(--serif); font-size: clamp(44px, 7vw, 116px); font-weight: 700; letter-spacing: -0.04em; line-height: 1.02; }
.bcenter .sub { font-size: clamp(15px, 1.5vw, 26px); color: var(--ink-2); }
.bcenter .floor-badge {
  font-family: var(--mono); font-size: clamp(16px, 1.7vw, 28px); font-weight: 700;
  color: var(--amber); border: 2px solid var(--amber); padding: 4px 16px; letter-spacing: 0.04em;
}

.blist { display: flex; flex-direction: column; width: min(720px, 100%); border-top: 1px solid var(--line); max-height: 34vh; overflow: hidden; }
.blist .row {
  display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center;
  padding: 8px; border-bottom: 1px solid var(--line);
  font-size: clamp(14px, 1.2vw, 20px); text-align: left;
}
.blist .row .r { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-3); font-weight: 700; }
.blist .row .s { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 0.8em; }

#audio-gate { cursor: pointer; }
#audio-gate .btn { pointer-events: auto; font-size: 20px; padding: 18px 40px; }

[hidden] { display: none !important; }

@media (max-width: 900px) {
  .board { grid-template-columns: 1fr; grid-template-areas: "head" "stage"; }
  .bside { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .feed-item { animation: none; }
  .split-bar span { transition: none; }
}
</style>
</head>
<body>

<div class="board">
  <header class="bhead">
    <div class="logo mono">12<span class="colon">:</span>55</div>
    <div class="meta">
      <div><span class="k">Round</span><span class="v" id="b-round">—</span></div>
      <div><span class="k">문항</span><span class="v" id="b-q">— / —</span></div>
      <div><span class="k">참가</span><span class="v" id="b-joined">0</span></div>
    </div>
    <div class="vip-flag" id="b-vip" hidden><span>👑</span><span id="b-vip-text"></span></div>
  </header>

  <main class="stage">
    <div class="stage-info">
      <h1 class="bq" id="b-question"></h1>
      <div class="btimer" id="b-timer"><div class="fill" id="b-timer-fill"></div></div>
      <p class="bcaption" id="b-caption" role="status" aria-live="polite"></p>
      <div class="stage-foot">
        <div class="bcount">
          <span class="n mono" id="b-alive">0</span>
          <div style="display:flex;flex-direction:column;gap:4px">
            <span class="k">생존</span>
            <span class="drop mono" id="b-drop"></span>
          </div>
        </div>

        <div class="split" id="b-split">
          <div class="split-nums mono"><span id="b-num-o">O —</span><span id="b-num-x">— X</span></div>
          <div class="split-bar"><span class="s-o" id="b-fill-o"></span><span class="s-x" id="b-fill-x"></span></div>
        </div>
      </div>
    </div>

    <div class="stage-canvas-wrap"><canvas id="stage-canvas"></canvas></div>

    <!-- 대기 / 결과 -->
    <section class="bcenter" id="b-center">
      <div class="label" id="b-center-label">대기 중</div>
      <div class="huge mono" id="b-center-big">12:55</div>
      <div class="sub" id="b-center-sub">매주 월요일 점심시간 마지막 5분</div>
      <div class="blist" id="b-center-list" hidden></div>
    </section>

    <!-- 오디오 잠금 해제. 브라우저는 클릭 전에는 소리를 못 낸다. -->
    <section class="bcenter" id="audio-gate">
      <div class="label">전광판 준비</div>
      <div class="huge mono" style="font-size:clamp(56px,10vw,150px)">12:55</div>
      <div class="sub">나레이션과 음악을 켜려면 한 번 눌러주세요</div>
      <button class="btn btn-primary" id="audio-go">준비 완료</button>
    </section>
  </main>

  <aside class="bside">
    <h2>본부별 생존</h2>
    <div class="divstand" id="b-divstand"></div>

    <h2>탈락</h2>
    <div class="feed" id="b-feed"></div>
  </aside>
</div>

<div class="ending" id="ending" hidden aria-live="polite">
  <canvas id="ending-canvas"></canvas>
</div>

<script src="music.js"></script>
<script src="roofimage.js"></script>
<script src="crowd.js"></script>
<script src="ending.js"></script>
<script src="sfx.js"></script>
<script src="commentary.js"></script>
<script src="board.js"></script>
</body>
</html>
